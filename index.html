<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07110C" />
    <script>
      // Applies the saved theme, or the system's, before the first paint so the page never flashes the wrong one.
      // The same rules live in src/theme.js; the two background colours match --workspace-bg in tokens.css.
      (function () {
        var choice = null;
        try { choice = localStorage.getItem('panta.theme'); } catch (error) {}
        var light = choice === 'light' || (choice !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#F3F7F4' : '#07110C');
      })();
    </script>
    <meta name="description" content="Panta — your work, over time." />
    <link rel="icon" href="/logos/panta-logo-kit/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/logos/panta-logo-kit/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/logos/panta-logo-kit/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <title>Panta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
